# Mirrors the checks pinned in .no-mistakes.yaml so the gate's CI step has real
# GitHub checks to monitor. Generated by `no-mistakes ci-workflow`, then edited
# for the Node toolchain.
name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: npx eslint . --ignore-path .gitignore

      - name: Build
        run: yarn build
